[package]
name = "smoltcp2socks"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "smoltcp2socks"
path = "src/main.rs"

[[bin]]
name = "smoltcp2socks_ca"
path = "src/ca_main.rs"

[[bin]]
name = "smoltcp2socks_rt"
path = "src/rt_main.rs"

[[bin]]
name = "smoltcp2socks_nat"
path = "src/nat_main.rs"

[[bin]]
name = "smoltcp2socks_v6"
path = "src/v6_main.rs"

[dependencies]
libc = "0.2"

[dependencies.smoltcp]
version = "0.12"
default-features = false
features = [
    "std", "alloc", "log",
    "medium-ethernet",
    "phy-tuntap_interface",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
]

# 与候选 A/B 一致：优化开满，别让「Rust 默认 debug」这种事混进结论里
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
