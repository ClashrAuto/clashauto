name: Build and Release

on:
  push:
    # 所有分支都构建。主分支(master/main)发正式 Release，其余分支发 prerelease ——
    # 功能分支可以先打包给人装上试，不污染正式版通道；app 里「接收测试版」开关决定要不要看到它们。
    branches:
      - '**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: ClashAuto
  QT_VERSION: 6.8.3
  QT_ARCH: win64_msvc2022_64
  BUILD_DIR: build-release
  STAGE_DIR: dist/package/ClashAuto

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # core_prefixes：打包集成的内核产物名前缀（fork ClashrAuto/clash 的正式版通道），
          # 逗号分隔按优先级排列。x64 优先 -compatible（v1 基线，普通 amd64 是 GOAMD64=v3，
          # 老 CPU 直接非法指令崩），与应用内 CoreRelease.h 的 assetPrefixes 一字不差。
          - arch: x64
            cmake_arch: x64
            qt_arch: win64_msvc2022_64
            core_prefixes: coast-windows-amd64-compatible-,coast-windows-amd64-v1-
          - arch: arm64
            cmake_arch: ARM64
            qt_arch: win64_msvc2022_arm64_cross_compiled
            core_prefixes: coast-windows-arm64-

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build version
        shell: pwsh
        run: |
          # 基线 major.minor 取自 CMakeLists，构建号用 git 提交数自动递增（每次提交 +1）
          $cmake = Get-Content "clashauto-c++\CMakeLists.txt" -Raw
          if ($cmake -notmatch 'project\s*\(\s*\S+\s+VERSION\s+([0-9]+)(?:\.([0-9]+))?') {
            throw "Cannot find project VERSION in clashauto-c++\CMakeLists.txt"
          }

          $major = $Matches[1]
          $minor = if ($Matches[2]) { $Matches[2] } else { "0" }
          $build = "$(git rev-list --count HEAD)".Trim()
          $version = "$major.$minor.$build"
          # 主分支 = 正式版，其余分支 = prerelease。
          # APP_VERSION 保持纯数字 major.minor.build —— 资源文件名(ClashAuto-<ver>-…)和 app 内的
          # 版本比较都靠它，掺字母会一起坏掉。分支上 build 天然大于主分支（= 主分支提交数 + 本分支
          # 的提交），版本序自然正确；tag 再加个短 sha，防「两个分支各 +N 撞到同一个号」。
          $isPre = if ("${{ github.ref }}" -eq "refs/heads/master" -or "${{ github.ref }}" -eq "refs/heads/main") { "false" } else { "true" }
          $tag = if ($isPre -eq "true") { "v$version-beta.$("${{ github.sha }}".Substring(0,7))" } else { "v$version" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IS_PRERELEASE=$isPre" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Release version: $version tag=$tag prerelease=$isPre (build number = commit count)"

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          # aqt 偶发拉包失败（下载源抖动）——之前 arm64 job 两次挂在这里都是它，且失败方式很差：
          # 装不上不当场报，一路拖到三分钟后的 Configure 才以 "QT_HOST_PATH not set" 报出来。
          # 包一个带重试的 helper，装不上就当场硬失败，别让后面的步骤替它背锅。
          function Aqt([string[]]$aqtArgs) {
            for ($i = 1; $i -le 3; $i++) {
              python -m aqt install-qt @aqtArgs
              if ($LASTEXITCODE -eq 0) { return }
              Write-Host "aqt 第 $i 次失败（exit=$LASTEXITCODE），重试..."
              Start-Sleep -Seconds 10
            }
            throw "aqt install-qt 三次均失败: $($aqtArgs -join ' ')"
          }
          if ("${{ matrix.arch }}" -eq "arm64") {
            # arm64 是交叉编译，必须先装宿主(x64) Qt 供 QT_HOST_PATH 用。
            Aqt @("windows","desktop","$env:QT_VERSION","win64_msvc2022_64","-O","C:\Qt")
          }
          Aqt @("windows","desktop","$env:QT_VERSION","${{ matrix.qt_arch }}","-O","C:\Qt")
          $qtRoot = Get-ChildItem "C:\Qt\$env:QT_VERSION" -Directory |
            Where-Object {
              (Test-Path (Join-Path $_.FullName "bin\qmake.exe")) -or
              (Test-Path (Join-Path $_.FullName "bin\qmake.bat"))
            } |
            Where-Object {
              if ("${{ matrix.arch }}" -eq "arm64") {
                $_.Name -like "*arm64*"
              } else {
                $_.Name -notlike "*arm64*"
              }
            } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $qtRoot) {
            throw "Cannot find installed Qt root"
          }
          "QT_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $hostQtRoot = Get-ChildItem "C:\Qt\$env:QT_VERSION" -Directory |
            Where-Object { $_.Name -notlike "*arm64*" -and (Test-Path (Join-Path $_.FullName "bin\windeployqt.exe")) } |
            Select-Object -First 1 -ExpandProperty FullName
          # arm64 交叉编译**必须**有宿主 Qt（CMakeLists 的 find_package 要 QT_HOST_PATH）。
          # 之前这里是静默的 if：装不上就跳过，把失败推给三分钟后的 Configure。改成当场硬失败。
          if ("${{ matrix.arch }}" -eq "arm64" -and -not $hostQtRoot) {
            throw "arm64 交叉编译缺宿主 Qt（win64_msvc2022_64 没装上）——QT_HOST_PATH 无从设置"
          }
          if ($hostQtRoot) {
            "QT_HOST_ROOT=$hostQtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Npcap SDK
        shell: pwsh
        # 透明网关 Windows 二层用 Npcap；编译需其 SDK（头 + 导入库）。运行时另需目标机装 Npcap 驱动。
        # npcap.com 偶发超时 → 多镜像 + 重试，避免网络抖动挡住整个 Windows 构建。
        run: |
          $zip = "$env:RUNNER_TEMP\npcap-sdk.zip"
          $urls = @(
            "https://npcap.com/dist/npcap-sdk-1.13.zip",
            "https://nmap.org/npcap/dist/npcap-sdk-1.13.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            for ($i = 1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest -Uri $u -OutFile $zip -TimeoutSec 90
                if ((Get-Item $zip).Length -gt 100000) { $ok = $true; break }
              } catch { Write-Host "下载 $u 第 $i 次失败: $_"; Start-Sleep -Seconds 6 }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "Npcap SDK 下载失败（所有镜像/重试均未成功）" }
          $dst = "$env:RUNNER_TEMP\npcap-sdk"
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          "NPCAP_SDK=$dst" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          $args = @(
            "-S", "clashauto-c++",
            "-B", $env:BUILD_DIR,
            "-G", "Visual Studio 17 2022",
            "-A", "${{ matrix.cmake_arch }}",
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT",
            "-DAPP_VERSION=$env:APP_VERSION"
          )
          if ("${{ matrix.arch }}" -eq "arm64") {
            $args += "-DQT_HOST_PATH=$env:QT_HOST_ROOT"
          }
          cmake @args

      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --parallel

      - name: Stage portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $pwd $env:STAGE_DIR
          # 扁平自包含：Coast.exe 直接放包根，无 clashauto-c++/Clashr-Auto 子目录（资源已内嵌 exe）。
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$env:BUILD_DIR\Release\Coast.exe" $stage -Force

          $deployTool = Join-Path $env:QT_ROOT "bin\windeployqt.exe"
          if (-not (Test-Path $deployTool)) {
            $deployTool = Join-Path $env:QT_ROOT "bin\windeployqt.bat"
          }
          if (-not (Test-Path $deployTool) -and $env:QT_HOST_ROOT) {
            $deployTool = Join-Path $env:QT_HOST_ROOT "bin\windeployqt.exe"
          }
          if (-not (Test-Path $deployTool)) {
            throw "Cannot find windeployqt"
          }
          # QML 应用：--qmldir 让 windeployqt 扫描本 app 的 .qml 源并部署所需 Qt Quick 运行时
          # + QML 模块插件（Qt6Quick、QtQuick.Controls[Basic]、QtQuick.Layouts、QtQuick.Templates、QtQuick.Window）。
          $qmlSrcDir = Join-Path $pwd "clashauto-c++\qml"
          # --no-opengl-sw：不打包 opengl32sw.dll(~20MB 软件 OpenGL)；--no-system-d3d-compiler：不打包 d3dcompiler_47.dll(~4MB)。
          # 二者本 app 都用不到——已在 main_qml.cpp 强制 Qt Quick 软件后端(QSGRendererInterface::Software)。
          & $deployTool --release --no-translations --no-opengl-sw --no-system-d3d-compiler --qmldir "$qmlSrcDir" "$stage\Coast.exe"

          # 显式打包 MSVC 运行库：--compiler-runtime 实测不落 msvcp140_1/_2.dll，
          # 未装 VC++ redist 的机器启动即 0xC0000135（真机验证）。从 VC Tools Redist 目录直接复制。
          $redistRoots = @()
          if ($env:VCToolsRedistDir) { $redistRoots += $env:VCToolsRedistDir }
          $redistRoots += (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC" -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          $crtDir = $null
          foreach ($rr in $redistRoots) {
            $crtDir = Get-ChildItem (Join-Path $rr "*\${{ matrix.arch }}\Microsoft.VC*.CRT") -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
            if ($crtDir) { break }
          }
          if ($crtDir) {
            Write-Host "Copying MSVC runtime from $crtDir"
            Copy-Item (Join-Path $crtDir "*.dll") $stage -Force
          } else {
            Write-Host "WARNING: MSVC runtime CRT dir not found; package may need VC++ redist"
          }

          if (-not (Test-Path "$stage\Coast.exe")) {
            throw "Missing staged executable"
          }
          # 上网历史库（src/HistoryStore）用 QSQLITE 驱动插件；windeployqt 跟着 Qt6Sql.dll 一起带上。
          # 缺了程序照常跑，只是历史静默不记录 —— 所以只警告不失败，但要在日志里看得见。
          if (-not (Test-Path "$stage\sqldrivers\qsqlite.dll")) {
            Write-Host "::warning::未见 sqldrivers\qsqlite.dll（上网历史/常用域名将不可用）"
          }

      - name: Bundle latest stable core
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          # 打包默认集成最新**正式版**内核到包根 core.exe；首次运行由
          # CoreController::seedBundledCore() 落位到 userDir\command\core.exe（缺了才补，
          # 绝不覆盖），之后的版本管理仍归应用内下载/更新。挑选规则与应用内 CoreRelease.h
          # 一字不差：走 /releases 全量列表（不能用 /releases/latest——fork 从上游继承了
          # 一堆零资产空 tag，latest 常正好落在那上面）、跳过 draft/prerelease、
          # 必须真带本平台产物才认。下载失败**打包当场失败**——默认集成的包缺内核是静默劣化。
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/ClashrAuto/clash/releases?per_page=20" -Headers $headers
          $asset = $null
          foreach ($r in $releases) {
            if ($r.draft -or $r.prerelease) { continue }
            foreach ($p in "${{ matrix.core_prefixes }}".Split(',')) {
              $asset = @($r.assets | Where-Object { $_.name.StartsWith($p) -and $_.name.EndsWith(".zip") })[0]
              if ($asset) { break }
            }
            if ($asset) { break }
          }
          if (-not $asset) { throw "正式版通道里没有 ${{ matrix.core_prefixes }} 产物" }
          Write-Host "集成内核: $($asset.name)"
          $tmp = Join-Path $env:RUNNER_TEMP "core-bundle"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          # 下载直链不带 Authorization：它 302 到对象存储，多带一层凭据可能被拒
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$tmp\core.zip"
          Expand-Archive -Path "$tmp\core.zip" -DestinationPath "$tmp\x" -Force
          $exe = Get-ChildItem "$tmp\x" -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "内核 zip 里没有 exe" }
          Copy-Item $exe.FullName "$env:STAGE_DIR\core.exe" -Force
          if (-not (Test-Path "$env:STAGE_DIR\core.exe")) { throw "core.exe 未落到包根" }

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$env:STAGE_DIR\*" -DestinationPath "dist\ClashAuto-$env:APP_VERSION-windows-${{ matrix.arch }}-portable.zip" -Force

      - name: Create installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsi = @'
          Unicode true
          Name "Coast"
          OutFile "dist\ClashAuto-$%APP_VERSION%-windows-$%APP_ARCH%-setup.exe"
          InstallDir "$LOCALAPPDATA\Coast"
          RequestExecutionLevel user
          AutoCloseWindow true

          Page directory
          Page instfiles
          UninstPage uninstConfirm
          UninstPage instfiles

          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "dist\package\ClashAuto\*"
            CreateDirectory "$SMPROGRAMS\Coast"
            CreateShortcut "$SMPROGRAMS\Coast\Coast.lnk" "$INSTDIR\Coast.exe"
            CreateShortcut "$DESKTOP\Coast.lnk" "$INSTDIR\Coast.exe"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            ; 交互安装装完自动打开程序（0.1.110 之前的一键更新走「打开安装包」老路径，
            ; 装完不会回到应用——由安装器补上）；静默(/S)不启，launchSilentUpdateAndRestart
            ; 的守护进程负责重启，避免双开
            IfSilent +2
            Exec '"$INSTDIR\Coast.exe"'
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\Coast.lnk"
            Delete "$SMPROGRAMS\Coast\Coast.lnk"
            RMDir "$SMPROGRAMS\Coast"
            RMDir /r "$INSTDIR"
          SectionEnd
          '@
          $nsi = $nsi.Replace('$%APP_VERSION%', $env:APP_VERSION)
          $nsi = $nsi.Replace('$%APP_ARCH%', '${{ matrix.arch }}')
          $nsi | Set-Content -Path installer.nsi -Encoding UTF8
          makensis installer.nsi

      - name: Generate SHA256 sidecars
        shell: pwsh
        run: |
          # 为每个发布物生成 <文件>.sha256（仅十六进制摘要）。应用更新时直连 GitHub
          # 取该边车校验安装包完整性——即使经 ghfast.top 镜像下载正文，摘要仍来自官方源，
          # 镜像无法在不被发现的情况下投递木马。边车随 dist/ClashAuto-* 一并上传。
          Get-ChildItem dist -Filter 'ClashAuto-*' -File | Where-Object { $_.Extension -ne '.sha256' } | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClashAuto-windows-${{ matrix.arch }}
          path: |
            dist/ClashAuto-*-windows-${{ matrix.arch }}-portable.zip
            dist/ClashAuto-*-windows-${{ matrix.arch }}-setup.exe

      - name: Write release notes
        if: github.event_name == 'push'
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: printf '%s\n' "$COMMIT_MSG" > release-notes.md

      - name: Upload to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # 名字带上分支，便于在 Release 列表里一眼分辨这是哪条分支的测试版。
          # ★ 资源**文件名**仍是 ClashAuto-<ver>-<平台>-<架构>-… 一个字没动 —— app 的一键更新
          #   是按文件名里的平台/架构挑资源的（UpdateController::recommendedIndex）。
          name: ${{ env.IS_PRERELEASE == 'true' && format('Clash Auto {0} (beta · {1})', env.APP_VERSION, github.ref_name) || format('Clash Auto {0}', env.APP_VERSION) }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          target_commitish: ${{ github.sha }}
          # 更新说明 = 触发本次构建的提交说明（app 内更新弹窗直接展示），经上一步写盘的
          # 文件传入。不能用 generate_release_notes：创建 release 时 GitHub 会把「提供的
          # body + 自动说明」合并，body 里的部分换行被转义成字面 \n；后续 job 的 body_path
          # 更新又会覆盖掉自动说明——它只留下污染的中间态，纯负作用，故移除。
          body_path: release-notes.md
          # prerelease 绝不能占 latest：/releases/latest 是正式版通道，被 beta 占了会把所有
          # 没开「接收测试版」的用户推到测试版上去。
          make_latest: ${{ env.IS_PRERELEASE == 'true' && 'false' || 'true' }}
          overwrite_files: true
          files: |
            dist/ClashAuto-*

  macos:
    name: macOS universal (x86_64 + arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build version
        shell: bash
        run: |
          set -euo pipefail
          # 基线 major.minor 取自 CMakeLists，构建号用 git 提交数自动递增（每次提交 +1）
          # [[:space:]] 而非 \s：macOS 的 BSD sed 不支持 \s（GNU sed 两种都认）
          base="$(sed -nE 's/.*project[[:space:]]*\([[:space:]]*[^ ]+[[:space:]]+VERSION[[:space:]]+([0-9]+(\.[0-9]+){1,3}).*/\1/p' clashauto-c++/CMakeLists.txt | head -n 1)"
          if [ -z "$base" ]; then
            echo "Cannot find project VERSION in clashauto-c++/CMakeLists.txt" >&2
            exit 1
          fi
          major="$(echo "$base" | cut -d. -f1)"
          minor="$(echo "$base" | cut -d. -f2)"
          [ -n "$minor" ] || minor=0
          build="$(git rev-list --count HEAD)"
          version="${major}.${minor}.${build}"
          # 主分支 = 正式版，其余分支 = prerelease。取舍见 windows job 那段注释。
          if [ "${{ github.ref }}" = "refs/heads/master" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            is_pre=false; tag="v$version"
          else
            is_pre=true; tag="v$version-beta.$(echo "${{ github.sha }}" | cut -c1-7)"
          fi
          {
            echo "APP_VERSION=$version"
            echo "RELEASE_TAG=$tag"
            echo "IS_PRERELEASE=$is_pre"
          } >> "$GITHUB_ENV"
          echo "Release version: $version tag=$tag prerelease=$is_pre (build number = commit count)"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja
          python3 -m pip install --user aqtinstall pillow \
            || python3 -m pip install --user --break-system-packages aqtinstall pillow

      - name: Install Qt (universal)
        shell: bash
        run: |
          set -euo pipefail
          # aqt 的 mac 官方构建即 x86_64+arm64 通用二进制
          python3 -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -O "$HOME/Qt"
          echo "QT_ROOT=$HOME/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"

      - name: Generate icon.icns
        shell: bash
        run: |
          set -euo pipefail
          # 从 assets/icon.ico 取最大帧生成 iconset → icns；CMake 检测到该文件即打进 Resources
          python3 - <<'PY'
          from PIL import Image
          import pathlib

          ico = Image.open("clashauto-c++/assets/icon.ico")
          sizes = sorted(ico.info.get("sizes") or {ico.size})
          ico.size = sizes[-1]
          ico.load()
          base = ico.convert("RGBA")
          out = pathlib.Path("icon.iconset")
          out.mkdir(exist_ok=True)
          for s in (16, 32, 128, 256, 512):
              base.resize((s, s), Image.LANCZOS).save(out / f"icon_{s}x{s}.png")
              base.resize((s * 2, s * 2), Image.LANCZOS).save(out / f"icon_{s}x{s}@2x.png")
          PY
          iconutil -c icns -o clashauto-c++/assets/icon.icns icon.iconset

      - name: Configure
        shell: bash
        run: |
          cmake -S clashauto-c++ -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION="$APP_VERSION" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build
        shell: bash
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Verify universal binary
        shell: bash
        run: |
          set -euo pipefail
          bin="$BUILD_DIR/Coast.app/Contents/MacOS/Coast"
          lipo -archs "$bin"
          lipo -archs "$bin" | grep -q x86_64
          lipo -archs "$bin" | grep -q arm64

      - name: Gateway self-test (feth)
        shell: bash
        # 用 feth 对 + 真实 BPF 端点跑一遍网关 headless 自测（不阻塞发布；失败作可见告警）。
        continue-on-error: true
        run: sudo bash validate/gateway_selftest_mac.sh "$BUILD_DIR/Coast.app/Contents/MacOS/Coast"

      # 导入 Developer ID 证书到临时 keychain（仅当设置了 secret；否则回退 ad-hoc，fork 仍能编）。
      # 复用 schat.build/qt-desktop.yml 的做法，凭据同名 secret（Team 6AXTRT5TV4）。
      - name: Import Developer ID signing cert
        id: signcert
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PW }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "MACOS_CERT_P12 未设置 — 回退 ad-hoc 签名"; echo "identity=-" >> "$GITHUB_OUTPUT"; exit 0
          fi
          KC="$RUNNER_TEMP/sign.keychain-db"; KPW="$(openssl rand -base64 18)"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "${CERT_PW:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KC" >/dev/null
          # 让临时 keychain 与默认 keychain 一起可搜，codesign 才能找到身份
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)".*/\1/')
          rm -f "$RUNNER_TEMP/cert.p12"
          [ -n "$IDENTITY" ] || { echo "导入的证书里没有 Developer ID Application 身份"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "imported identity: $IDENTITY"

      - name: Stage app bundle
        shell: bash
        env:
          SIGN_IDENTITY: ${{ steps.signcert.outputs.identity }}
        run: |
          set -euo pipefail
          APP="$BUILD_DIR/Coast.app"
          "$QT_ROOT/bin/macdeployqt" "$APP" -verbose=1

          # 重新嵌入特权 helper 与其 launchd plist（macdeployqt 可能动过 Contents/MacOS）。
          # helper 独立可执行由 CMake 构建在 $BUILD_DIR 根下（OUTPUT_NAME），universal。
          mkdir -p "$APP/Contents/Library/LaunchDaemons"
          cp "$BUILD_DIR/com.yuehongsun.coast.helper" "$APP/Contents/MacOS/com.yuehongsun.coast.helper"
          cp "clashauto-c++/helper/com.yuehongsun.coast.helper.plist" "$APP/Contents/Library/LaunchDaemons/"
          lipo -archs "$APP/Contents/MacOS/com.yuehongsun.coast.helper"

          # 资源已内嵌 exe(qrc)，不再往 bundle 塞 Contents/Clashr-Auto —— app 自包含。

          # 签名（公证必需硬化运行时 + 安全时间戳）。macdeployqt 之后再签：install_name_tool 改写会破坏更早签名。
          # 关键：helper 必须用显式 -i 指定 identifier = com.yuehongsun.coast.helper（= launchd Label）。
          # 否则 codesign 把可执行名末尾的「.helper」当扩展名剥掉，identifier 变成 com.yuehongsun.coast，
          # 与注册 Label 不一致 → SMAppService daemon 启动即被 Launch Constraint Violation SIGKILL，核心无法 root。
          # 用 --deep 一把签全（含 frameworks）会把 helper identifier 又剥回去，故末尾再单独 -i 重签 helper + 浅签 app 重新封存。
          HELPER="$APP/Contents/MacOS/com.yuehongsun.coast.helper"
          HELPER_ID="com.yuehongsun.coast.helper"
          if [ -n "${SIGN_IDENTITY:-}" ] && [ "$SIGN_IDENTITY" != "-" ]; then
            codesign --force --deep --options runtime --timestamp --sign "$SIGN_IDENTITY" "$APP"
            codesign --force --options runtime --timestamp -i "$HELPER_ID" --sign "$SIGN_IDENTITY" "$HELPER"
            codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$APP"
            echo "signed with: $SIGN_IDENTITY"
          else
            codesign --force --deep --sign - "$APP"                       # ad-hoc 兜底（无 cert secret）
            codesign --force -i "$HELPER_ID" --sign - "$HELPER"
            codesign --force --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP" && echo "codesign verify OK"
          codesign --verify --strict --verbose=2 "$HELPER" && echo "helper codesign verify OK"
          echo "helper identity:"; codesign -dvv "$HELPER" 2>&1 | grep -Ei 'Identifier|TeamIdentifier'

      - name: Create DMG
        shell: bash
        env:
          SIGN_IDENTITY: ${{ steps.signcert.outputs.identity }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          mkdir -p dist/dmgroot
          ditto "$BUILD_DIR/Coast.app" "dist/dmgroot/Coast.app"
          ln -s /Applications dist/dmgroot/Applications
          # ad-hoc（无证书）时才附「首次打开」引导；已公证的包无需，跳过
          if [ -z "${SIGN_IDENTITY:-}" ] || [ "$SIGN_IDENTITY" = "-" ]; then
          cat > "dist/dmgroot/打开说明.txt" <<'EOF'
          Coast（macOS 通用版：Intel + Apple Silicon）

          安装：把「Coast」拖到「Applications」文件夹。

          首次打开：本应用未经 Apple 公证，直接双击会被系统拦截。
          方法一：在「应用程序」中右键点击「Coast」→ 打开 → 再点「打开」。
          方法二：终端执行 xattr -cr "/Applications/Coast.app" 后正常双击。
          EOF
          fi
          DMG="dist/ClashAuto-${APP_VERSION}-macos-universal.dmg"
          hdiutil create -volname "Coast" -srcfolder dist/dmgroot -ov -format UDZO "$DMG"
          # 公证 + staple：仅在真签名 + 有 notary 凭据时（Apple 拒绝 ad-hoc 提交）。
          # 用 App Store Connect API Key(.p8)；失败则本步失败 → 不上传未公证的 dmg。
          if [ -n "${SIGN_IDENTITY:-}" ] && [ "$SIGN_IDENTITY" != "-" ] && [ -n "${NOTARY_KEY:-}" ]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/nkey.p8"
            xcrun notarytool submit "$DMG" \
              --key "$RUNNER_TEMP/nkey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
              --wait --timeout 45m
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG" && echo "notarized + stapled OK"
            rm -f "$RUNNER_TEMP/nkey.p8"
          else
            echo "无 notary 凭据或 ad-hoc 签名 — 跳过公证"
          fi

      - name: Generate SHA256 sidecars
        shell: bash
        run: |
          set -euo pipefail
          # 每个发布物生成 <文件>.sha256（仅摘要），供应用更新时直连 GitHub 校验完整性
          for f in dist/ClashAuto-*; do
            case "$f" in *.sha256) continue;; esac
            [ -f "$f" ] || continue
            shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClashAuto-macos-universal
          path: |
            dist/ClashAuto-*-macos-universal.dmg

      # 不再从本 CI 往 GitHub Release 上传 mac DMG：签名+公证的 mac 包由独立仓库
      # integemjack/schat.build 的 "clashauto macOS (signed)" workflow 构建并 --clobber
      # 到同一个 "Clash Auto <ver>" latest release。此前本 job 用 overwrite_files:true 传
      # 同名 dmg，会把 schat.build 的签名包覆盖回未签名版本（mac 客户端 GET /releases/latest
      # 就会下到未签名包）。故这里只保留上面的 workflow artifact（供该 run 内下载/排查），
      # 不碰 Release。Windows/Linux 两个 job 仍会创建并维护该 release。

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # core_prefixes：打包集成的内核产物名前缀（含义见 windows job 矩阵的注释）
          - arch: x64
            runner: ubuntu-22.04
            deb_arch: amd64
            core_prefixes: coast-linux-amd64-compatible-,coast-linux-amd64-v1-
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            core_prefixes: coast-linux-arm64-

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build version
        shell: bash
        run: |
          set -euo pipefail
          # 基线 major.minor 取自 CMakeLists，构建号用 git 提交数自动递增（每次提交 +1）
          # [[:space:]] 而非 \s：macOS 的 BSD sed 不支持 \s（GNU sed 两种都认）
          base="$(sed -nE 's/.*project[[:space:]]*\([[:space:]]*[^ ]+[[:space:]]+VERSION[[:space:]]+([0-9]+(\.[0-9]+){1,3}).*/\1/p' clashauto-c++/CMakeLists.txt | head -n 1)"
          if [ -z "$base" ]; then
            echo "Cannot find project VERSION in clashauto-c++/CMakeLists.txt" >&2
            exit 1
          fi
          major="$(echo "$base" | cut -d. -f1)"
          minor="$(echo "$base" | cut -d. -f2)"
          [ -n "$minor" ] || minor=0
          build="$(git rev-list --count HEAD)"
          version="${major}.${minor}.${build}"
          # 主分支 = 正式版，其余分支 = prerelease。取舍见 windows job 那段注释。
          if [ "${{ github.ref }}" = "refs/heads/master" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            is_pre=false; tag="v$version"
          else
            is_pre=true; tag="v$version-beta.$(echo "${{ github.sha }}" | cut -c1-7)"
          fi
          {
            echo "APP_VERSION=$version"
            echo "RELEASE_TAG=$tag"
            echo "IS_PRERELEASE=$is_pre"
          } >> "$GITHUB_ENV"
          echo "Release version: $version tag=$tag prerelease=$is_pre (build number = commit count)"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # —— 构建/打包必需（Qt 改由 aqt 装 6.8.3，不再用系统 qt6-*：22.04=6.2/24.04=6.4 太旧，
          #    缺 loadFromModule 等 Qt 6.5+ QML API）。缺一不可，一条命令、任一失败即报错 ——
          #   build-essential/cmake/ninja-build → 编译
          #   libgl1-mesa-dev                   → Qt6::Gui/Quick 链接 OpenGL
          #   patchelf                          → 给主程序写 $ORIGIN/lib 的 RPATH（自带 Qt 运行时）
          #   python3-pip                       → 装 aqtinstall
          #   fakeroot/zip                      → 打 .deb / 便携 zip
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            patchelf \
            python3-pip \
            fakeroot \
            zip
          # —— 非阻断：aqt 版 Qt 的构建工具(qmlcachegen 依赖 libglib2.0) 与 xcb 平台插件的运行期系统库。
          # 构建机不运行 app，装不上仅告警不阻断（22.04/24.04 间包名可能不同）；这些库最终以 .deb Depends
          # 声明给终端用户。
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            || echo "::warning::部分 Qt 运行时系统库未安装（不影响构建，仅影响本机直接运行便携包）"

      - name: Install Qt (aqt)
        shell: bash
        run: |
          set -euo pipefail
          # 与 Windows/macOS 同版 Qt 6.8.3。arm64 是独立 host：
          #   x64  → host=linux        arch=linux_gcc_64
          #   arm64→ host=linux_arm64  arch=linux_gcc_arm64（Qt 6.7+ 起官方提供 linux 桌面 arm64 二进制；
          #          aqtinstall ≥3.1.12 起可拉取，本处装最新版 aqt）
          python3 -m pip install --user aqtinstall \
            || python3 -m pip install --user --break-system-packages aqtinstall
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            python3 -m aqt install-qt linux_arm64 desktop "$QT_VERSION" linux_gcc_arm64 -O "$HOME/Qt"
          else
            python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/Qt"
          fi
          # aqt 不同版本落地目录名可能是 gcc_64 / linux_gcc_64（arm64 同理），用 qmake 反查根目录避免写死。
          qmake_path="$(find "$HOME/Qt/$QT_VERSION" -type f -name qmake -path '*/bin/qmake' | head -n1)"
          if [ -z "$qmake_path" ]; then
            echo "找不到已安装的 Qt（qmake 缺失）" >&2
            find "$HOME/Qt" -maxdepth 3 -type d >&2 || true
            exit 1
          fi
          qt_root="$(dirname "$(dirname "$qmake_path")")"
          echo "QT_ROOT=$qt_root" >> "$GITHUB_ENV"
          echo "Qt root: $qt_root"

      - name: Configure
        shell: bash
        run: |
          cmake -S clashauto-c++ -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" \
            -DAPP_VERSION="$APP_VERSION"

      - name: Build
        shell: bash
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Stage portable app
        shell: bash
        run: |
          set -euo pipefail
          stage="$STAGE_DIR"
          app_dir="$stage"
          rm -rf "$stage"
          mkdir -p "$app_dir"

          cp "$BUILD_DIR/coast" "$app_dir/"
          chmod +x "$app_dir/coast"

          # —— 打包 Qt 6.8.3 运行时（用户系统已无匹配 Qt，必须随包自带库+插件+QML 模块）——
          # 保持 Qt 的「prefix 相对布局」：app_dir 作 prefix，lib/ plugins/ qml/ 维持与其原始相同的
          # 相对关系，这样 Qt 各库/插件/QML 插件内置的 RUNPATH($ORIGIN/../../lib 等)无需 patch 即自洽；
          # 仅主程序需用 patchelf 写 $ORIGIN/lib 的 RPATH。
          mkdir -p "$app_dir/lib" "$app_dir/plugins" "$app_dir/qml"
          # 全部 Qt6 共享库 + ICU（-a 保留符号链接与 so 版本号链）
          cp -a "$QT_ROOT"/lib/libQt6*.so* "$app_dir/lib/"
          cp -a "$QT_ROOT"/lib/libicu*.so* "$app_dir/lib/" 2>/dev/null || true
          # 插件整目录拷更稳：platforms/libqxcb、tls(openssl 后端，HTTPS 订阅/更新必需)、
          # imageformats、iconengines、xcbglintegrations、platforminputcontexts 等
          cp -a "$QT_ROOT"/plugins/. "$app_dir/plugins/"
          # QML 运行时模块：QtQuick、QtQuick.Controls[Basic]、QtQuick.Layouts、QtQuick.Templates、
          # QtQuick.Window、QtQml 等（整目录拷）
          cp -a "$QT_ROOT"/qml/. "$app_dir/qml/"

          # qt.conf 指向自带的 plugins/qml（相对可执行文件目录）
          cat > "$app_dir/qt.conf" <<'EOF'
          [Paths]
          Prefix = .
          Libraries = lib
          Plugins = plugins
          Qml2Imports = qml
          EOF

          # 主程序 RPATH 指向自带 lib（$ORIGIN 相对二进制真实路径，经 /usr/bin 符号链接调用也成立）
          patchelf --set-rpath '$ORIGIN/lib' "$app_dir/coast"

          test -x "$app_dir/coast"
          # 关键运行时校验：平台插件 + Qt Quick 库必须已入包（缺则包必崩，就地失败）
          test -e "$app_dir/plugins/platforms/libqxcb.so"
          test -e "$app_dir/lib/libQt6Quick.so.6"
          ls "$app_dir/plugins/tls/"*.so >/dev/null 2>&1 \
            || echo "::warning::未见 plugins/tls 后端（HTTPS 订阅/更新可能不可用，请核对 aqt Qt 是否含 openssl 后端）"
          # 上网历史库（src/HistoryStore）用 QSQLITE 驱动插件；缺了不会崩，但历史会静默不记录
          test -e "$app_dir/plugins/sqldrivers/libqsqlite.so" \
            || echo "::warning::未见 plugins/sqldrivers/libqsqlite.so（上网历史/常用域名将不可用）"

      - name: Bundle latest stable core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_PREFIXES: ${{ matrix.core_prefixes }}
        run: |
          set -euo pipefail
          # 打包默认集成最新**正式版**内核到包根 core（.deb 落 /opt/coast/core）；首次运行由
          # CoreController::seedBundledCore() 落位到 ~/.local/share/Coast/command/core（缺了
          # 才补，绝不覆盖）。挑选规则与应用内 CoreRelease.h 一字不差：/releases 全量列表
          # （latest 会落到 fork 从上游继承的零资产空 tag 上）、跳过 draft/prerelease。
          # 下载失败**打包当场失败**——默认集成的包缺内核是静默劣化。
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/ClashrAuto/clash/releases?per_page=20' -o /tmp/core-releases.json
          url="$(python3 - /tmp/core-releases.json <<'PY'
          import json, os, sys
          releases = json.load(open(sys.argv[1]))
          for release in releases:
              if release.get("draft") or release.get("prerelease"):
                  continue
              for prefix in os.environ["CORE_PREFIXES"].split(","):
                  for asset in release.get("assets", []):
                      name = asset.get("name", "")
                      if name.startswith(prefix) and name.endswith(".gz"):
                          print(asset["browser_download_url"])
                          sys.exit(0)
          sys.exit(1)
          PY
          )" || { echo "正式版通道里没有 $CORE_PREFIXES 产物" >&2; exit 1; }
          echo "集成内核: $(basename "$url")"
          # 下载直链不带 Authorization：它 302 到对象存储，多带一层凭据可能被拒
          curl -fsSL --retry 3 "$url" | gunzip > "$STAGE_DIR/core"
          test -s "$STAGE_DIR/core"
          chmod 755 "$STAGE_DIR/core"

      - name: Create portable tar.gz
        shell: bash
        run: |
          mkdir -p dist
          tar -C dist/package -czf "dist/ClashAuto-${APP_VERSION}-linux-${{ matrix.arch }}-portable.tar.gz" ClashAuto
          (cd dist/package && zip -r "../ClashAuto-${APP_VERSION}-linux-${{ matrix.arch }}-portable.zip" ClashAuto)

      - name: Create deb package
        shell: bash
        run: |
          set -euo pipefail
          pkg_root="dist/deb/ClashAuto"
          install_root="$pkg_root/opt/coast"
          mkdir -p "$install_root" "$pkg_root/usr/share/applications" "$pkg_root/usr/bin" "$pkg_root/DEBIAN"

          # 扁平安装：暂存目录根即 coast + Qt 运行时（无 clashauto-c++ 子目录），整体落到 /opt/coast/
          cp -a "$STAGE_DIR/." "$install_root/"
          ln -s /opt/coast/coast "$pkg_root/usr/bin/coast"

          cat > "$pkg_root/usr/share/applications/coast.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Coast
          Exec=/opt/coast/coast
          Terminal=false
          Categories=Network;
          EOF

          installed_size="$(du -sk "$install_root" | cut -f1)"
          cat > "$pkg_root/DEBIAN/control" <<EOF
          Package: coast
          Version: ${APP_VERSION}
          Section: net
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Installed-Size: ${installed_size}
          Maintainer: Coast <auto@clash.com>
          Depends: libc6, libstdc++6, libgl1, libopengl0, libegl1, libglib2.0-0 | libglib2.0-0t64, libdbus-1-3, libfontconfig1, libfreetype6, libssl3 | libssl3t64, libx11-6, libxcb1, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-randr0, libxcb-render0, libxcb-render-util0, libxcb-shape0, libxcb-shm0, libxcb-sync1, libxcb-xfixes0, libxcb-xkb1, libxcb-glx0, libxcb-util1, libxkbcommon0, libxkbcommon-x11-0
          Description: Coast Qt desktop client
           Coast desktop client built with Qt Quick (QML).
          EOF

          fakeroot dpkg-deb --build "$pkg_root" "dist/ClashAuto-${APP_VERSION}-linux-${{ matrix.arch }}.deb"

      - name: Generate SHA256 sidecars
        shell: bash
        run: |
          set -euo pipefail
          # 每个发布物生成 <文件>.sha256（仅摘要），供应用更新时直连 GitHub 校验完整性
          for f in dist/ClashAuto-*; do
            case "$f" in *.sha256) continue;; esac
            [ -f "$f" ] || continue
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClashAuto-linux-${{ matrix.arch }}
          path: |
            dist/ClashAuto-*-linux-${{ matrix.arch }}-portable.tar.gz
            dist/ClashAuto-*-linux-${{ matrix.arch }}-portable.zip
            dist/ClashAuto-*-linux-${{ matrix.arch }}.deb

      - name: Write release notes
        if: github.event_name == 'push'
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: printf '%s\n' "$COMMIT_MSG" > release-notes.md

      - name: Upload to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # 名字带上分支，便于在 Release 列表里一眼分辨这是哪条分支的测试版。
          # ★ 资源**文件名**仍是 ClashAuto-<ver>-<平台>-<架构>-… 一个字没动 —— app 的一键更新
          #   是按文件名里的平台/架构挑资源的（UpdateController::recommendedIndex）。
          name: ${{ env.IS_PRERELEASE == 'true' && format('Clash Auto {0} (beta · {1})', env.APP_VERSION, github.ref_name) || format('Clash Auto {0}', env.APP_VERSION) }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          target_commitish: ${{ github.sha }}
          # 更新说明 = 触发本次构建的提交说明（app 内更新弹窗直接展示），经上一步写盘的
          # 文件传入。不能用 generate_release_notes：创建 release 时 GitHub 会把「提供的
          # body + 自动说明」合并，body 里的部分换行被转义成字面 \n；后续 job 的 body_path
          # 更新又会覆盖掉自动说明——它只留下污染的中间态，纯负作用，故移除。
          body_path: release-notes.md
          # prerelease 绝不能占 latest：/releases/latest 是正式版通道，被 beta 占了会把所有
          # 没开「接收测试版」的用户推到测试版上去。
          make_latest: ${{ env.IS_PRERELEASE == 'true' && 'false' || 'true' }}
          overwrite_files: true
          files: |
            dist/ClashAuto-*-linux-*

  # 透明网关 headless 自测：下载打好的 linux-x64 包（自带 Qt，offscreen 可独立跑），用 TAP 把真实
  # 内核 TCP 当被劫持设备，经 NetStack 拨内置假 SOCKS，验证「用户态栈转发 + 每设备身份」——不需真机/真实 ARP。
  # 独立 job：不阻塞 release（release 已由 linux/windows job 发布），失败只作可见告警。
  gateway-selftest:
    name: Gateway self-test (Linux netstack)
    needs: [linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ClashAuto-linux-x64
          path: dl
      - name: Install runtime deps
        shell: bash
        # 打好的包自带 Qt 库，但仍依赖系统的 OpenGL/EGL/glib/fontconfig 等。Qt6::Gui 硬链接
        # libOpenGL.so.0(ELF NEEDED，即便软件后端)，裸 runner 缺它 → coast 无法启动（对齐 .deb 的 libopengl0 依赖）。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopengl0 libegl1 libglib2.0-0 libfontconfig1 libdbus-1-3 libfreetype6 ethtool tcpdump
      - name: Run headless gateway self-test
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe tun 2>/dev/null || true
          mkdir -p app
          tar -C app -xzf dl/ClashAuto-*-linux-x64-portable.tar.gz
          BIN="$(find app -type f -name coast | head -1)"
          test -n "$BIN" || { echo "找不到 coast 二进制"; exit 1; }
          chmod +x "$BIN"
          sudo bash validate/gateway_selftest.sh "$BIN"

  # macOS 正式包不在本 CI 打（无签名/公证证书）——由外部构建仓库的「专用分支」承载
  # （该分支已配 Developer ID 签名+公证，workflow 用 on:push 监听本分支）。push 到
  # master/main 时，本 job 用 PAT 向那个专用分支推一个空提交来触发 mac 打包；对方
  # checkout clashauto 的 master（即刚发布的 release commit）、构建 universal、签名公证
  # 后发布到 clashauto 同一个 Release。打包内容完全不在外部仓库的默认分支上。
  # 目标仓库地址/令牌/分支都放本仓库 Secrets，不在代码里明文暴露：
  #   SCHAT_BUILD_REPO   —— 目标仓库 owner/repo
  #   SCHAT_BUILD_TOKEN  —— 对该仓库有 contents:write 的 PAT
  #   SCHAT_BUILD_BRANCH —— 专用打包分支名（可选，缺省 clashauto-mac）
  # 必需 secret（REPO/TOKEN）未配置时本 job 自动跳过（不失败）。
  trigger-mac:
    name: Trigger signed macOS build
    # 只依赖 windows（release 由它创建，mac DMG 随后追加）；mac 构建与 linux 无关，
    # 不因 linux 失败被 skip。
    needs: [windows]
    # ★★ 已停用（2026-07-31）：macOS 只发 **Swift 版**，触发签名的活儿挪到了 `macos-swift`
    #    job 里的 "Trigger signed macOS build" 那一步 —— 两条腿都往同一个 Release 传 macOS
    #    包的话，app 内的一键更新（按扩展名挑第一个 .dmg）会挑到哪个纯看运气。
    #
    #    与旧版的关键差别：新那步会把**目标 release tag** 一并传给 schat.build。
    #    早先只推一个空提交，对方只能自己猜发到哪个 release，于是 beta 分支的构建会把
    #    签名 DMG 盖到正式版上 —— 这正是当初把 beta 的 mac 包整个停掉的原因。
    #    保留整个 job 而不是删掉：要恢复 Qt 版发布时，把下面的 if 改回
    #    `github.event_name == 'push' && (ref == master || ref == main)` 即可。
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Trigger macOS build via empty commit
        env:
          SCHAT_TOKEN: ${{ secrets.SCHAT_BUILD_TOKEN }}
          SCHAT_REPO: ${{ secrets.SCHAT_BUILD_REPO }}
          SCHAT_BRANCH: ${{ secrets.SCHAT_BUILD_BRANCH }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SCHAT_TOKEN:-}" ] || [ -z "${SCHAT_REPO:-}" ]; then
            echo "::warning::SCHAT_BUILD_TOKEN/REPO 未配置，跳过 macOS 签名构建触发"
            exit 0
          fi
          branch="${SCHAT_BRANCH:-clashauto-mac}"
          tmp="$(mktemp -d)"
          origin="https://x-access-token:${SCHAT_TOKEN}@github.com/${SCHAT_REPO}.git"
          mask() { sed 's#x-access-token:[^@]*@#x-access-token:***@#g'; }
          git clone --depth 1 --branch "$branch" "$origin" "$tmp/repo" 2>&1 | mask
          cd "$tmp/repo"
          git config user.name "clashauto-ci"
          git config user.email "ci@clashauto.local"
          # 空提交本身不改任何文件，只为触发对方分支的 on:push → mac 打包
          git commit --allow-empty -m "trigger: build clashauto@${GITHUB_SHA} macOS"
          git push "$origin" "HEAD:${branch}" 2>&1 | mask
          echo "已向 ${branch} 推空提交，触发 macOS 签名构建：clashauto@${GITHUB_SHA}"

  # ————————————————————————————————————————————————————————————————
  # Swift 版 macOS 客户端（macos/）。**完全独立于上面的 Qt 流水线**：
  # 不共用 env、不 needs 任何 job、也不参与 Release 发布，只产出 Actions artifact。
  #
  # 为什么不直接发到 Release：Qt 那条线已经通过外部签名仓库(integemjack/schat.build)
  # 往同一个 Release 上传 macOS DMG，而 app 内的更新检查是**按扩展名挑资源**的
  # （UpdateChecker.macAsset 取第一个 .dmg）。两个 macOS 包落在同一个 Release 上，
  # 老版本会挑到哪个完全看运气。要发布必须先决定「谁是正牌 macOS 包」，
  # 那是产品决定，不该由 CI 悄悄决定 —— 见 macos/PLAN.md 阶段 8。
  macos-swift:
    name: macOS (Swift) build + test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          # swift-testing（Tests/ 里用的 @Test/#expect）要 Xcode 16+；
          # 不固定版本，取 runner 上最新的那个即可。
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "使用 $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          swift --version

      - name: Resolve build version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # 版本口径与 Qt 那条线保持一致：major.minor 取自 CMakeLists，构建号用提交数。
          # 刻意复用同一套编号，免得同一个 commit 在两条线上出两个不同版本号。
          base="$(sed -nE 's/.*project[[:space:]]*\([[:space:]]*[^ ]+[[:space:]]+VERSION[[:space:]]+([0-9]+(\.[0-9]+){1,3}).*/\1/p' clashauto-c++/CMakeLists.txt | head -n 1)"
          major="$(echo "$base" | cut -d. -f1)"
          minor="$(echo "$base" | cut -d. -f2)"
          count="$(git rev-list --count HEAD)"
          version="${major}.${minor}.${count}"
          # 主分支 = 正式版，其余分支 = prerelease。tag 再缀短 sha，
          # 防「两个分支各 +N 撞到同一个号」。口径与 windows/linux job 完全一致。
          if [ "$GITHUB_REF" = "refs/heads/master" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
            is_pre=false; tag="v${version}"
          else
            is_pre=true; tag="v${version}-beta.${GITHUB_SHA:0:7}"
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${is_pre}"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: $version tag=$tag prerelease=$is_pre"

      - name: Build
        working-directory: macos
        run: swift build -c release

      - name: Test
        working-directory: macos
        run: swift test

      - name: Check i18n coverage
        working-directory: macos
        run: |
          # 只报数不拦门：漏翻会回落成中文，是个质量问题而不是坏掉。
          # 拿它当硬性门槛会让「加一句新文案」这种小改动被 11 种语言卡住。
          python3 scripts/i18n_check.py

      # 把 Developer ID 证书导进一个用完即弃的钥匙串。**secret 没配就退回 ad-hoc** ——
      # 这样 fork 也能构建出包（只是装不了免密 helper），而不是整条流水线红掉。
      # 做法照搬 integemjack/schat.build 里已经跑通的那套。
      - name: Import Developer ID cert
        id: signcert
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PW }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "::notice::MACOS_CERT_P12 未配置 —— 用 ad-hoc 签名（此包装不了免密 helper）"
            echo "identity=-" >> "$GITHUB_OUTPUT"; exit 0
          fi
          KC="$RUNNER_TEMP/sign.keychain-db"; KPW="$(openssl rand -base64 18)"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "${CERT_PW:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KC" >/dev/null
          # 把临时钥匙串挂进搜索列表，否则 codesign 找不到这个身份
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)".*/\1/')
          rm -f "$RUNNER_TEMP/cert.p12"
          [ -n "$IDENTITY" ] || { echo "导入的证书里没有 Developer ID Application 身份"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Package Coast.app (universal)
        working-directory: macos
        env:
          # make_app.sh 默认集成最新正式版内核，要打 GitHub API 挑产物；Actions 共享
          # 出口 IP，匿名限流（60 次/时）几乎必中 —— 必须带 token。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/make_app.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --universal \
            --sign "${{ steps.signcert.outputs.identity }}"

      - name: Verify bundle
        working-directory: macos
        run: |
          set -euo pipefail
          # 通用二进制两个架构都要在（regression.sh 不查这个，单独验）
          lipo -info Coast.app/Contents/MacOS/Coast
          lipo -info Coast.app/Contents/MacOS/com.yuehongsun.coast.helper
          codesign --verify --deep --strict Coast.app
          # 打包产物的全套自检钩子（paths/topo/helper/sysproxy）。--no-build 复用上一步
          # 刚打好的包，与本地 `bash scripts/regression.sh` 同一套逻辑，不让 CI 和本地漂移。
          # 脚本把「环境验不了」（如 ad-hoc 装不了 helper）判为 SKIP，只有真失败才退非 0。
          bash scripts/regression.sh --no-build

      - name: Package .zip / .dmg + notarize
        working-directory: macos
        env:
          SIGN_IDENTITY: ${{ steps.signcert.outputs.identity }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          ZIP="out/Coast-${VERSION}-macos-universal.zip"
          DMG="out/Coast-${VERSION}-macos-universal.dmg"
          # 更新用 zip 必须用 ditto：普通 zip 不保留 bundle 的符号链接与扩展属性，
          # 解出来的 .app 签名当场失效。
          ditto -c -k --keepParent Coast.app "$ZIP"
          # hdiutil 偶发「resource busy」，重试几次比整条流水线红掉划算
          for attempt in 1 2 3 4; do
            hdiutil detach "/Volumes/Coast" -force >/dev/null 2>&1 || true
            hdiutil create -volname "Coast" -srcfolder Coast.app -ov -format UDZO "$DMG" && break
            echo "hdiutil create 失败（第 $attempt/4 次），8 秒后重试"; sleep 8
          done
          [ -f "$DMG" ] || { echo "ERROR: dmg 没生成"; exit 1; }

          # 公证 + 装订。**只在真签且有公证凭据时做**；一旦开做就必须成功 ——
          # 政策是「release 里绝不放未公证的包」，所以这里失败即整步失败、artifact 不上传，
          # 而不是悄悄发一个用户双击会被 Gatekeeper 拦下的东西。
          if [ -n "${SIGN_IDENTITY:-}" ] && [ "$SIGN_IDENTITY" != "-" ] && [ -n "${NOTARY_KEY:-}" ]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/nkey.p8"
            xcrun notarytool submit "$DMG" \
              --key "$RUNNER_TEMP/nkey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
              --wait --timeout 45m
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            rm -f "$RUNNER_TEMP/nkey.p8"
            echo "公证 + 装订完成"
          else
            echo "::notice::未真签或未配公证凭据 —— 跳过公证（此包会被 Gatekeeper 拦下，仅供开发验证）"
          fi
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coast-swift-macos-universal
          path: macos/out/*
          if-no-files-found: error

      - name: Release notes
        if: github.event_name == 'push'
        run: printf '%s\n' "${COMMIT_MSG}" > macos/out/release-notes.md
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}

      # ★ 不在这里发 Release。签名与公证由外部仓库 integemjack/schat.build 做
      #   （本仓库的 CI 拿不到 Developer ID 私钥，也不该拿到）。这里只把**未签名**的产物
      #   留成 Actions artifact 供排查，然后触发对方去签、去传。
      #
      #   触发时必须带上**目标 release tag**：早先只推一个空提交，对方只能自己猜发到哪个
      #   release，于是 beta 分支的构建会把签名 DMG 盖到正式版的 release 上 —— 这正是当初
      #   把 beta 的 mac 包整个停掉的原因。把 tag 显式传过去，beta 和正式版就各回各家。
      - name: Trigger signed macOS build (integemjack/schat.build)
        if: github.event_name == 'push'
        env:
          SCHAT_TOKEN: ${{ secrets.SCHAT_BUILD_TOKEN }}
          SCHAT_REPO: ${{ secrets.SCHAT_BUILD_REPO }}
          SCHAT_BRANCH: ${{ secrets.SCHAT_BUILD_BRANCH }}
          TARGET_TAG: ${{ steps.ver.outputs.tag }}
          TARGET_PRERELEASE: ${{ steps.ver.outputs.prerelease }}
          TARGET_VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SCHAT_TOKEN:-}" ] || [ -z "${SCHAT_REPO:-}" ]; then
            echo "::warning::SCHAT_BUILD_TOKEN/REPO 未配置，跳过 macOS 签名构建触发"
            exit 0
          fi
          branch="${SCHAT_BRANCH:-clashauto-mac}"
          tmp="$(mktemp -d)"
          origin="https://x-access-token:${SCHAT_TOKEN}@github.com/${SCHAT_REPO}.git"
          mask() { sed 's#x-access-token:[^@]*@#x-access-token:***@#g'; }
          git clone --depth 1 --branch "$branch" "$origin" "$tmp/repo" 2>&1 | mask
          cd "$tmp/repo"
          git config user.name "clashauto-ci"
          git config user.email "ci@clashauto.local"
          # 参数走**提交说明**而不是文件：对方分支上除了 workflow 没有别的内容，
          # 改文件会污染它的历史；而 commit message 在 on:push 里用
          # `github.event.head_commit.message` 就能原样读到。
          # 键值一行一个，好解析、也好在 Actions 日志里一眼看清这次要发到哪。
          git commit --allow-empty -m "trigger: clashauto macOS (swift)" \
            -m "source-repo: ${GITHUB_REPOSITORY}" \
            -m "source-sha: ${GITHUB_SHA}" \
            -m "source-ref: ${GITHUB_REF_NAME}" \
            -m "product: coast-swift" \
            -m "release-tag: ${TARGET_TAG}" \
            -m "prerelease: ${TARGET_PRERELEASE}" \
            -m "version: ${TARGET_VERSION}"
          git push "$origin" "HEAD:${branch}" 2>&1 | mask
          echo "已触发签名构建 → ${SCHAT_REPO}@${branch}"
          echo "  源: clashauto@${GITHUB_SHA} (${GITHUB_REF_NAME})"
          echo "  目标 release: ${TARGET_TAG} (prerelease=${TARGET_PRERELEASE})"
