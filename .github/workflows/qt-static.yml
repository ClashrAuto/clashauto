name: Warm static Qt cache

# 「打包全用静态链接库」的前置：aqtinstall 只发共享构建的 Qt，静态版必须自己从源码编。
# 这个 workflow 把五套配置各编一遍并写进 Actions 缓存，之后 release.yml 每次推送直接复用。
#
# 什么时候要手动跑它：
#   · 抬 Qt 版本之后（缓存键含版本号，旧键不会被命中）
#   · 改了 .github/actions/qt-static/ 里的配方（键含该目录哈希，同样会换键）
#   · release.yml 的某个 job 日志里出现 cache-hit=false 且编了一个多小时（说明缓存被淘汰了）
#
# 不跑它也不会坏：release.yml 用的是同一个 composite action，没命中就地编，只是那次慢。
# 定时任务的唯一作用是**续命** —— GitHub 的缓存 7 天不被访问就淘汰，周期性访问能保住它。

on:
  workflow_dispatch:
  schedule:
    # 每周一 03:17 UTC。错开整点，避开 GitHub 的定时任务高峰（整点排队常常几十分钟起）。
    - cron: '17 3 * * 1'

# Qt 版本按平台分开（与 release.yml 的 QT_VERSION / QT_VERSION_LINUX 必须一致）：
# Windows / macOS 6.11.1，Linux 留在 6.8.3。缓存键含版本号，两边不一致就是**永远不命中**，
# 而表现不是报错，是每次发布都从源码编一遍。

jobs:
  warm:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # 一套挂了不该拖累其余四套：五套之间没有任何依赖，各自独立进缓存。
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            qt: 6.11.1
          - target: windows-arm64
            runner: windows-2022
            qt: 6.11.1
          - target: linux-x64
            runner: ubuntu-22.04
            qt: 6.8.3
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            qt: 6.8.3
          - target: macos-universal
            runner: macos-14
            qt: 6.11.1
    # 交叉编 Qt 自己 + 通用二进制（等于编两遍）都很慢，默认 360 分钟够用但别更短。
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      # 宿主 Qt 那一步没了：windows-arm64 要的同版本宿主 Qt 由 qt-static action 自己解析
      # （取同版本同配方的 windows-x64 静态 Qt）。原来用的 aqtinstall 在 6.11 上必挂 ——
      # Qt 从 6.9 起改了在线仓库目录布局，aqt 3.3.0 仍按旧布局拼路径。
      # 连带的前提：windows-arm64 必须在 windows-x64 **之后**才有得编。

      - name: Build / restore static Qt
        id: qt
        uses: ./.github/actions/qt-static
        with:
          qt-version: ${{ matrix.qt }}
          target: ${{ matrix.target }}
          # macOS 的 Qt 本身也必须是通用二进制，否则 app 那侧的 -DCMAKE_OSX_ARCHITECTURES
          # 会因为链到单架构静态库而失败（本仓库在 brew 的 libcrypto 上正是这么栽的，
          # CMakeLists 顶部那段注释记着）。部署目标要与 release.yml 的 macos job 一致。
          extra-cmake: ${{ matrix.target == 'macos-universal' && '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0' || '' }}

      - name: 指向真正的发布方
        shell: bash
        run: |
          echo "本 workflow 只把结果放进 **Actions 缓存**（按分支隔离、7 天淘汰、跨不了仓库）。"
          echo "对外可复用的预编产物由 ClashrAuto/qt-static 的 Build static Qt 发布 ——"
          echo "那边用自己仓库的 GITHUB_TOKEN 发自己的 release，不需要任何 PAT 或 secret。"
          echo "要补/更新预编产物，去那边手动跑一次，别在这里找。"
